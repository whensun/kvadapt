[project]
name = "kvadapt"
version = "0.1.0"
description = "KV-cache-aware request admission for vLLM"
readme = "README.md"
authors = [
    { name = "Theodorus Wensan Februanto", email = "theodoruswensanfebruanto025@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
